name: FootFive CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: footfive-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit / type / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Bundle size note
        run: |
          ls -lh dist/assets/*.js | awk '{print $5, $9}'
          TOTAL=$(du -sb dist | cut -f1)
          echo "dist_bytes=$TOTAL"
          # Soft budget 2MB for JS+CSS assets
          if [ "$TOTAL" -gt 2500000 ]; then
            echo "WARN: dist larger than 2.5MB"
          fi

  api-e2e:
    name: PocketBase API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Always install from the checksum-pinned release; no existing binary is trusted.
      - name: Install verified PocketBase 0.28.4
        run: bash scripts/fetch-pocketbase.sh
      - name: World setup atomicity (disposable PocketBase)
        run: npm run test:world-setup
      - name: Command Charge atomicity (disposable PocketBase)
        run: npm run test:command-charge
      - name: Lineup atomicity (disposable PocketBase)
        run: npm run test:lineup
      - name: Live coaching order (disposable PocketBase)
        run: npm run test:coaching
      - name: Overclock kick-off cost (disposable PocketBase)
        run: npm run test:overclock
      - name: Balance replay determinism (headless engine, 200 seeds)
        run: npm run test:balance-replay
      - name: Admin mutations and pagination (disposable PocketBase)
        env:
          ADMIN_MUTATIONS_PB_PORT: "8306"
        run: npm run test:admin-mutations
      - name: HTTP body and safe error contracts (disposable PocketBase)
        env:
          HTTP_ERRORS_PB_PORT: "8307"
        run: npm run test:http-errors
      - name: Native collection guards and cleanup (disposable PocketBase)
        env:
          COLLECTION_GUARDS_PB_PORT: "8308"
        run: npm run test:collection-guards
      - name: Pure squad reads and repair receipts (disposable PocketBase)
        env:
          SQUAD_READS_PB_PORT: "8309"
        run: npm run test:squad-reads
      - name: Start test PocketBase
        run: |
          rm -rf pocketbase/pb_data_test
          mkdir -p pocketbase/pb_data_test
          cd pocketbase
          ./pocketbase serve --http=127.0.0.1:8091 --dir=./pb_data_test > ../e2e-pb.log 2>&1 &
          echo $! > ../pb.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8091/api/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8091/api/health
      - name: Seed + API e2e
        env:
          E2E_PB_URL: http://127.0.0.1:8091
        run: |
          node scripts/e2e-seed.mjs
          node tests/integration/e2e-api.mjs
      - name: Cleanup
        if: always()
        run: |
          if [ -f pb.pid ]; then kill $(cat pb.pid) || true; fi
          rm -rf pocketbase/pb_data_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-e2e-logs
          path: |
            e2e-pb.log
          if-no-files-found: ignore

  browser-e2e:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Always install from the checksum-pinned release; no existing binary is trusted.
      - name: Install verified PocketBase 0.28.4
        run: bash scripts/fetch-pocketbase.sh
      - name: Install chromium matching package
        run: npx playwright install --with-deps chromium
      - name: Run E2E (API + UI)
        env:
          CI: "1"
          E2E_ALL: "0"
        run: bash scripts/e2e-run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
            e2e-pb.log
            e2e-web.log
          if-no-files-found: ignore
