name: Deploy FootFive

# Deploys only a commit FootFive CI fully tested: automatically after its push run on
# main succeeds, or by hand for an exact main SHA whose push run passed. Every job
# builds, deploys and records that SHA; GITHUB_SHA is the default-branch head on
# workflow_run, never the tested commit, so nothing here uses it.
on:
  workflow_run:
    workflows: [FootFive CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character main commit SHA whose FootFive CI push run passed
        required: true
        type: string
      rollback:
        description: Emergency rollback (allow a tested main commit older than the main head)
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-footfive-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Verify tested commit
    # Failed, cancelled, non-push, foreign or other-workflow CI runs never deploy.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.path == '.github/workflows/footfive-ci.yml' &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      # Trusted gate code from main; no secrets or SSH before this job passes.
      - name: Checkout gate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require FootFive CI success for the exact commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then sha="$INPUT_SHA"; else sha="$RUN_SHA"; fi
          args=("$sha")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$ROLLBACK" = true ]; then args+=(--rollback); fi
          # Validates the SHA format before it reaches GITHUB_OUTPUT.
          node scripts/verify-deploy-ci.mjs "${args[@]}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test-and-build:
    name: Test & production build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Confirm exact commit
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build (/footfive/)
        env:
          VITE_BASE_PATH: /footfive/
          VITE_POCKETBASE_URL: https://jdwd40.com/footfive-pb
        run: npm run build

      - name: Guard dist secrets
        run: |
          set -euo pipefail
          if grep -RInE 'ghp_[A-Za-z0-9]+|sk-[A-Za-z0-9]{20,}|password\s*[:=]\s*["'\''][^"'\'']{8,}' dist/ 2>/dev/null; then
            echo "Refusing deploy: possible secret in dist/"
            exit 1
          fi
          echo "dist secret scan clean"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

      - name: Upload PocketBase code artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketbase-code
          path: |
            pocketbase/pb_hooks
            pocketbase/pb_migrations
          retention-days: 3

  deploy:
    name: Deploy to VPS
    needs: [gate, test-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download PocketBase code
        uses: actions/download-artifact@v4
        with:
          name: pocketbase-code
          path: pocketbase/

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}" || { echo "Missing secret VPS_HOST"; exit 1; }
          test -n "${VPS_PORT:-}" || { echo "Missing secret VPS_PORT"; exit 1; }
          test -n "${VPS_SSH_PRIVATE_KEY:-}" || { echo "Missing secret VPS_SSH_PRIVATE_KEY"; exit 1; }
          test -n "${VPS_KNOWN_HOSTS:-}" || { echo "Missing secret VPS_KNOWN_HOSTS"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin host identity from controller-provisioned secret; no runtime
          # ssh-keyscan (trust-on-first-use is not acceptable for deploys).
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "${VPS_USER:-}" || { echo "Missing secret VPS_USER"; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Missing verified deploy SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          REMOTE="${VPS_USER}@${VPS_HOST}"
          SSH=(ssh -p "${VPS_PORT}" -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "${REMOTE}")

          "${SSH[@]}" 'echo ssh_ok && whoami && test -d /home/jd/footfive'

          # Backups come first, before any production change; any failure aborts the
          # deploy. /var/backups/footfive is root:root mode 700, so jd cannot write it
          # directly: use non-interactive sudo for the backup dir, snapshot and copies.
          # Backups stay root-owned.
          "${SSH[@]}" "sudo -n install -d -m 700 -o root -g root /var/backups/footfive/${STAMP}"
          # Online, verified SQLite snapshot of the live data (PocketBase keeps running);
          # the helper comes from this tested checkout, never the server.
          "${SSH[@]}" "sudo -n python3 -I - /home/jd/footfive/pb_data /var/backups/footfive/${STAMP}/pb_data" < scripts/pb-data-backup.py
          # Current hooks + migrations + web + backup scripts.
          "${SSH[@]}" "if [ -d /home/jd/footfive/pocketbase/pb_hooks ]; then sudo -n cp -a /home/jd/footfive/pocketbase/pb_hooks /var/backups/footfive/${STAMP}/pb_hooks; else echo 'skip backup: no existing pb_hooks'; fi"
          "${SSH[@]}" "if [ -d /home/jd/footfive/pocketbase/pb_migrations ]; then sudo -n cp -a /home/jd/footfive/pocketbase/pb_migrations /var/backups/footfive/${STAMP}/pb_migrations; else echo 'skip backup: no existing pb_migrations'; fi"
          "${SSH[@]}" "if [ -d /var/www/jdwd40.com/html/footfive ]; then sudo -n cp -a /var/www/jdwd40.com/html/footfive /var/backups/footfive/${STAMP}/web; else echo 'skip backup: no existing web root'; fi"
          "${SSH[@]}" "if [ -d /home/jd/footfive/scripts ]; then sudo -n cp -a /home/jd/footfive/scripts /var/backups/footfive/${STAMP}/scripts; else echo 'skip backup: no existing scripts'; fi"

          # Timestamped release of SPA
          "${SSH[@]}" "mkdir -p /home/jd/footfive/releases/${STAMP} /home/jd/footfive/pocketbase/pb_hooks /home/jd/footfive/pocketbase/pb_migrations /home/jd/footfive/logs"

          # Frontend → release dir then web root + current symlink
          tar -C dist -czf - . | "${SSH[@]}" "tar -C /home/jd/footfive/releases/${STAMP} -xzf -"
          "${SSH[@]}" "ln -sfn /home/jd/footfive/releases/${STAMP} /home/jd/footfive/current"
          "${SSH[@]}" "mkdir -p /var/www/jdwd40.com/html/footfive && rsync -a --delete /home/jd/footfive/releases/${STAMP}/ /var/www/jdwd40.com/html/footfive/"

          # PocketBase migrations, then hooks (binary + pb_data stay on server). The service
          # reloads when its hooks change and applies pending migrations as it starts, so new
          # hooks must never arrive before the migrations they need.
          tar -C pocketbase/pb_migrations -czf - . | "${SSH[@]}" 'rm -rf /home/jd/footfive/pocketbase/pb_migrations/* && tar -C /home/jd/footfive/pocketbase/pb_migrations -xzf -'
          tar -C pocketbase/pb_hooks -czf - . | "${SSH[@]}" 'rm -rf /home/jd/footfive/pocketbase/pb_hooks/* && tar -C /home/jd/footfive/pocketbase/pb_hooks -xzf -'

          # Daily backup scripts run as root by footfive-backup.timer: staged, then
          # renamed into place helper first, so the timer never runs half an update.
          tar -C scripts -czf - footfive-backup.sh pb-data-backup.py | "${SSH[@]}" 'set -eu; d=/home/jd/footfive/scripts; mkdir -p "$d"; s=$(mktemp -d "$d/.stage.XXXXXX"); tar -C "$s" -xzf -; chmod 755 "$s/footfive-backup.sh" "$s/pb-data-backup.py"; mv -f "$s/pb-data-backup.py" "$d/pb-data-backup.py"; mv -f "$s/footfive-backup.sh" "$d/footfive-backup.sh"; rmdir "$s"'

          # Restart system service (NOPASSWD sudo on VPS).
          # Health bodies are captured, never piped: under remote set -eu a
          # failed curl aborts the command before any marker can be written.
          # The VPS only needs curl: the app health body is echoed between
          # delimiters, extracted on the runner, and validated by the shared
          # Node validator (status === "ok" && worldAvailable === true).
          health_out="$("${SSH[@]}" "set -eu; sudo systemctl restart footfive-pocketbase.service; sleep 3; sudo systemctl is-active footfive-pocketbase.service; pb_health=\$(curl -sf http://127.0.0.1:8091/api/health); ff_health=\$(curl -sf http://127.0.0.1:8091/api/footfive/health); printf '%s\\n' \"\$pb_health\"; printf '%s\\n' 'FF_HEALTH_BEGIN'; printf '%s\\n' \"\$ff_health\"; printf '%s\\n' 'FF_HEALTH_END'")"
          printf '%s\n' "$health_out"
          ff_body="$(printf '%s\n' "$health_out" | awk '/^FF_HEALTH_END$/{exit} found{print} /^FF_HEALTH_BEGIN$/{found=1}')"
          test -n "$ff_body" || { echo "app health body missing from remote output"; exit 1; }
          printf '%s' "$ff_body" | node scripts/validate-health.mjs

          # Provenance: record markers only after the validated-healthy app
          # above. Never written for a degraded or unreachable deploy.
          "${SSH[@]}" "echo ${STAMP} > /home/jd/footfive/DEPLOYED_STAMP"
          "${SSH[@]}" "echo ${DEPLOY_SHA} > /home/jd/footfive/DEPLOYED_SHA"

          # Prune old releases (keep last 8)
          "${SSH[@]}" 'cd /home/jd/footfive/releases && ls -1dt */ 2>/dev/null | tail -n +9 | xargs -r rm -rf'

          echo "Deploy finished stamp=${STAMP} sha=${DEPLOY_SHA}"

      - name: Smoke test production
        run: |
          set -euo pipefail
          # sed consumes all input: avoids curl SIGPIPE (exit 23) under pipefail.
          headers=$(curl -sfI https://jdwd40.com/footfive/)
          printf '%s\n' "$headers" | sed -n '1,5p'
          curl -sf https://jdwd40.com/footfive-pb/api/health
          echo
          health=$(curl -sf https://jdwd40.com/footfive-pb/api/footfive/health)
          printf '%s' "${health:0:400}"
          echo
          # Semantic gate: fail on degraded / missing-world / malformed bodies,
          # not just HTTP 200. Same shared validator as the remote gate.
          printf '%s' "$health" | node scripts/validate-health.mjs
          code=$(curl -s -o /dev/null -w "%{http_code}" https://jdwd40.com/footfive-pb/api/footfive/world)
          echo "world unauth status=${code} (expect 401)"
          test "$code" = "401"
