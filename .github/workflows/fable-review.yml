name: Fable review policy

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  verify:
    # Only the repository owner's review-record comments re-run the gate (the check
    # script trusts owner records only); PR events still run for every PR.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       (contains(github.event.comment.body, '<!-- footfive-fable-review:v1 -->') ||
        contains(github.event.changes.body.from, '<!-- footfive-fable-review:v1 -->')))
    # Job-level so a skipped run (any other comment on the PR) never cancels an
    # in-flight verification; only runs that pass the filter above share the group.
    concurrency:
      group: fable-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out or execute the PR's code with this write-capable token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inherit approved labels and verify recorded Fable review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fable-check-workflow.mjs
