# FootFive / Proball — Nginx example for VPS
# Review and adapt paths/domains before use. Do NOT auto-overwrite production.
#
# Layout assumption:
#   /var/www/footfive/dist          React build
#   /opt/pocketbase/pocketbase      0.28.4 binary
#   /opt/pocketbase/pb_data
#   /opt/pocketbase/pb_hooks
#   /opt/pocketbase/pb_migrations
# PocketBase listens on 127.0.0.1:8090

upstream pocketbase_upstream {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name footfive.example.com;

    # ssl_certificate     /etc/letsencrypt/live/footfive.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/footfive.example.com/privkey.pem;

    root /var/www/footfive/dist;
    index index.html;

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache (hashed filenames from Vite)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PocketBase REST API — never cache authenticated responses
    location /api/ {
        proxy_pass http://pocketbase_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Realtime / SSE (PocketBase subscriptions)
    location /api/realtime {
        proxy_pass http://pocketbase_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Admin UI optional — restrict by IP if desired
    location /_/ {
        proxy_pass http://pocketbase_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 20m;
}

server {
    listen 80;
    server_name footfive.example.com;
    return 301 https://$host$request_uri;
}
